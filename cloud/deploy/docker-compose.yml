services:
  cunlian:
    build:
      context: ../..
      dockerfile: cloud/deploy/Dockerfile
    env_file:
      - .env
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - projects:/data
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
volumes:
  projects:
